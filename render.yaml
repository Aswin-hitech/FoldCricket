services:
  - type: web
    name: handcricket-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # gthread + simple-websocket gives real WebSocket upgrades. A single worker
    # is required: live room state and the pause timers are in-process.
    startCommand: gunicorn --worker-class gthread --threads 100 --workers 1 --timeout 120 --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: FLASK_DEBUG
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      # Neon Postgres connection string for player accounts, e.g.
      # postgresql://user:pass@ep-xxx-pooler.region.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: "ip-logs"
      # Account storage: "auto" activates Neon Postgres as soon as DATABASE_URL
      # is set (the account tables are created automatically on first boot)
      # and otherwise falls back to the local SQLite file so sign-in never breaks.
      - key: USER_STORE
        value: "auto"
      # Optional: set CREATOR_PASSWORD_HASH (scrypt hash) instead of a
      # plaintext CREATOR_PASSWORD in the Render dashboard.
